name: Deploy to GitHub Pages
on:
  push:
    branches: [ "main" ]  # или master, если ваша основная ветка так называется
  workflow_dispatch:       # позволяет запускать вручную

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Generate config.js from variables
        run: |
          echo "Создаю config.js с APP_ID = '${{ vars.APP_ID }}'"
          echo "window.APP_CONFIG = {" > config.js
          echo "  app_id: '${{ vars.APP_ID }}'" >> config.js
          echo "};" >> config.js
          echo "Содержимое config.js:"
          cat config.js
      
      - name: Setup Pages
        uses: actions/configure-pages@v4
      
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'  # загружаем все файлы из корня, включая config.js
      
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
